[package]
name = "tw-car-claim-estimator"
version = "0.4.0"
description = "台灣車禍理賠金額估算器 — 律師事務所桌面版"
authors = ["FlowTrace Labs"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tw_car_claim_estimator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
